version: "3.9"

# Self-hosted WhatsApp automation powered by:
# https://github.com/evolution-foundation/evolution-api (v2.3.7)
services:
  evolution-postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${WHATSAPP_DB_PASSWORD:?Set WHATSAPP_DB_PASSWORD}
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data

  evolution-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - evolution_redis_data:/data

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    depends_on:
      - evolution-postgres
      - evolution-redis
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: ${WHATSAPP_PUBLIC_API_URL:-http://localhost:8080}
      CORS_ORIGIN: ${WHATSAPP_APP_ORIGIN:-http://localhost:3001}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${WHATSAPP_DB_PASSWORD}@evolution-postgres:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: hometech-whatsapp
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      # Pairing is more reliable with local caching: Redis latency during
      # WhatsApp pre-key generation can cause the phone to reject the link.
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/6
      CACHE_REDIS_PREFIX_KEY: hometech-whatsapp
      CACHE_REDIS_SAVE_INSTANCES: "true"
      DATABASE_SAVE_DATA_LABELS: "false"
      CONFIG_SESSION_PHONE_VERSION: "2.3000.1033773198"
      AUTHENTICATION_API_KEY: ${WHATSAPP_API_KEY:?Set WHATSAPP_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      LOG_LEVEL: ERROR,WARN,INFO
      LOG_BAILEYS: error
      DEL_INSTANCE: "false"
      DEL_TEMP_INSTANCES: "false"
      TELEMETRY: "false"
    volumes:
      - evolution_instances:/evolution/instances

  # Publishes Evolution API through the free, account-assigned ngrok domain.
  # Keeping this in the same Compose stack makes the tunnel recover together
  # with the WhatsApp service after Docker Desktop or the Mac restarts.
  evolution-tunnel:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    depends_on:
      - evolution-api
    command: ["http", "evolution-api:8080", "--log=stdout"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?Set NGROK_AUTHTOKEN}
    ports:
      - "127.0.0.1:4040:4040"

volumes:
  evolution_postgres_data:
  evolution_redis_data:
  evolution_instances:
